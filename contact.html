<body>

    <nav>
        <ul class="sidebar"> <!-- Hidden on large screen, visible on small screens -->
            <li onclick="hideSidebar()"><a href=""><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#082a13"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg></a></li> <!-- Sidebar icon cribbed from google - I got the idea from a great tutorial -->
            <li><a href="menu.html">Cupcakes</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <ul>
            <li><a href="index.html"><img src="images/logo-icon.png" alt="Trish's Treats"></a></li>
            <li class="hide-on-mobile"><a href="menu.html">Cupcakes</a></li>
            <li class="hide-on-mobile"><a href="about.html">About</a></li>
            <li class="hide-on-mobile"><a href="contact.html">Contact</a></li>
            <li class="menu-button" onclick="showSidebar()"><a href="javascript:void(0)"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#082a13"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg></a></li> <!-- Another icon from Google -->
        </ul>
    </nav>

    <main>
        <div class="contact-blurb">
            <h1>Get in Touch</h1>
            <p>Have a question about our cupcakes? Want to place a custom order? We'd love to hear from you! Fill out the form below and we'll get back to you as soon as possible.</p>

            <!-- Form action should point to the backend server to handle the data submission. Right now it simply POSTs the data to a null 'a' link -->
            <form class="contact-form" action="" method="POST">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <ul>
            <li>&copy; 2026 - <a href="https://www.patrickmgrace.com/">Standard Grace</a></li>
        </ul>
    </footer>
<!-- Sidebar Control Script -- I cheated a bit here and used some minor javascript to control the sidebar. I got the idea from a tutorial and its simple enough that I understand how and why it works, so I figured I would be safe to use it. -->
    <script>
        function showSidebar(){
            const sidebar = document.querySelector('.sidebar')
            sidebar.style.display = 'flex'
        }
        function hideSidebar(){
            const sidebar = document.querySelector('.sidebar')
            sidebar.style.display = 'none'            
        }
    </script>
</body>
</html>
